name: 콘텐츠 스튜디오에 검토 대기로 등록

on:
  push:
    branches: [main, master]
    paths:
      - 'posts/**'
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 등록 (새 글만, 이미 있으면 건너뜀)
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          CONTENT_UPLOAD_TOKEN: ${{ secrets.CONTENT_UPLOAD_TOKEN }}
        run: python scripts/register_to_studio.py
        
